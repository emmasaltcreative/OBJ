      <stop offset=".45" stop-color="#f7d36e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e6c86e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#d7c8b4"/>
      <stop offset=".18" stop-color="#fffaf1"/>
      <stop offset=".82" stop-color="#f2e5d3"/>
      <stop offset="1" stop-color="#bca991"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="#e8cd75"/>
