<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">One More Chapter reading candle</title>
  <desc id="desc">A warm cream candle in printed glass glowing on a butter yellow table.</desc>
  <defs>
