<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Good Glass</title>
  <desc id="desc">A printed iced coffee glass with striped straw on a library sage table.</desc>
